[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nexis"
version = "0.1"
requires-python = ">=3.11"
# Pinned to the versions of the conda env the paper's runs used
# (/nfs/scistore19/locatgrp/rcadei/.conda/envs/crl, Python 3.11.8).
dependencies = [
    "numpy==1.26.4",
    "scipy==1.15.3",
    "pandas==2.2.3",
    "pyarrow==23.0.0",
    "scikit-learn==1.5.2",
    "statsmodels==0.14.2",
    "lightgbm==4.4.0",
    "joblib==1.4.2",
    "matplotlib==3.10.8",
    "tqdm==4.66.4",
]

[project.optional-dependencies]
# Foundation-model embeddings, SAE training, VLM interpretation (GPU steps).
gpu = [
    "torch==2.5.1",
    "torchvision==0.20.1",
    "timm==1.0.25",
    "overcomplete==0.3.0",
    "datasets==4.5.0",
    "huggingface_hub==0.36.0",
    "safetensors==0.4.3",
    "transformers==4.57.3",
    "accelerate==1.13.0",
    "bitsandbytes==0.49.2",
    "pillow==12.3.0",
]
# Satellite downloads (Google Earth Engine), tiles and maps (Uganda, Ghana).
geo = [
    "earthengine-api==1.7.24",
    "requests==2.32.3",
    "rasterio==1.4.4",
    "tifffile==2025.3.30",
    "scikit-image==0.25.2",
    "geopandas==1.1.3",
    "shapely==2.1.2",
]

[tool.setuptools.packages.find]
where = ["src"]
